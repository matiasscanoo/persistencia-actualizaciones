# Compose de este servicio solo. Va encima de la infraestructura compartida (repo
# dockers: Consul, Traefik, MongoDB y Redis), que se levanta primero. El sistema completo
# se levanta con el compose del repo integracion.
name: persistencia-actualizaciones

services:
  persistencia-actualizaciones:
    build: .
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: pdfs_db
      MONGO_COLLECTION: pdfs
      REDIS_URL: redis://redis:6379/0
      LOCK_TIMEOUT_SECONDS: "5"
      CONSUL_ENABLED: "true"
      CONSUL_HTTP_ADDR: http://consul:8500
      CONSUL_HTTP_TOKEN_FILE: /run/secrets/consul_microservices_token
      CONSUL_SERVICE_ADDRESS: persistencia-actualizaciones
      CONSUL_SERVICE_PORT: "8000"
    secrets:
      - consul_microservices_token
    networks:
      - redutn

networks:
  redutn:
    external: true
    name: redutn

secrets:
  consul_microservices_token:
    file: ../dockers/consul/generated/microservices.token
