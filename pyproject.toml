[project]
name = "persistencia-actualizaciones"
version = "0.1.0"
description = "Microservicio de escritura de documentos PDF (MongoDB + Redis)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "motor>=3.7.1",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "black",
    "httpx",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
